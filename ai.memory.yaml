- context: "Wayback Machine URL Handling"
  instruction: |
    When a user provides a Wayback Machine URL (e.g., https://web.archive.org/web/YYYYMMDDHHMMSS/TARGET_URL):
    1. Extract the TARGET URL (the original source) and use it for all content analysis, validation, and metadata extraction.
    2. Treat the provided WBM URL as a "User-Provided Snapshot" and verify its availability.
    3. Do NOT strip the WBM prefix without retaining the snapshot information; use it to avoid redundant archiving.
    4. Populate "Original/Source URL" with the extracted TARGET URL, and "Archived URL" with the full WBM URL.