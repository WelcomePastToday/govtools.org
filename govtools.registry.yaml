# Central Registry of GovTools Applications
# Single Source of Truth for Portals, Status, and Deployment Metadata

apps:
  - id: gov-posts
    name: "Test Gov Posts Tracker"
    description: "A dashboard for observing U.S. State Deptartment post counts"
    path: "govtools-posts-tracker"
    url: "/gov-posts"
    status: active
    project_info:
      note: "Live Dashboard"
      link_text: "View Analysis"
      link_url: "/gov-posts"

  - id: gov-web-edits
    name: "Test Gov Document Change Monitor"
    description: "Detects content changes in 383 federal government documents using Wayback Machine captures. Updated weekly."
    path: "gov-web-edits"
    url: "/gov-web-edits"
    status: active
    project_info:
      note: "Weekly scan · 2024-01-01 to present"
      link_text: "View Report"
      link_url: "/gov-web-edits"

  - id: govdoc-cataloger
    name: "Test FDLP Cataloger"
    description: "Archive and report government documents to the GPO."
    path: "govdoc-cataloger"
    url: "https://cataloger.govtools.org"
    port: 3001
    status: active
    project_info:
      note: "Source Code"
      link_text: "GitHub"
      link_url: "https://github.com/WelcomePastToday/govdoc-cataloger"

  - id: ia-documents
    name: "Auto Update Reports"
    description: "Automated reporting pipeline for government document update tracking."
    path: "ia-documents"
    url: "https://documents.govtools.org"
    port: 3003
    status: active
    hidden: true
  - id: eot-explorer
    name: "EOT Explorer 2024"
    description: "Multi-archiver forensic audit of the 2024 End Of Term web crawl. Deduplicating billions of government records."
    path: "eot-explorer"
    url: "/eot/contributors"
    status: active
    project_info:
      note: "Live Dashboard: 3.6B+ Baseline"
      link_text: "View Forensic Audit"
      link_url: "/eot/contributors"

  - id: model-evals
    name: "Model Evals — Metadata-Assertion Pipeline Evaluations"
    description: "Two evaluations of automated metadata-assertion pipelines: (1) Interpolation — an LLM's ability to access and reason over tables and charts inside archival PDFs; (2) ANT Catalog — the ability to create document metadata, especially government classification. Both benchmark open and frontier models on Internet Archive / government collections."
    # path = the data/eval/pipeline repo (Model Evals). NOTE: the public web UI for both
    # variations is served from the govtools.org repo (src/app/model-evals), NOT this path.
    path: "model-evals"
    url: "/model-evals"
    status: active
    project_info:
      note: "Two variations · table/chart reasoning + government-classification metadata"
      link_text: "View Reports"
      link_url: "/model-evals"

  - id: cfpb-removed-content
    name: "CFPB Removed Web Content"
    description: "Inventory of 3,923 Consumer Financial Protection Bureau pages removed from the live website in May–June 2026, recovered and content-verified from the Internet Archive Wayback Machine. Each record links to the exact capture and shows a preview thumbnail."
    path: "cfpb-static"
    url: "/cfpb/"
    status: active
    # Intentionally unlisted: stays live at /cfpb but must NOT appear as a public card/link.
    hidden: true

  - id: to-do-list-manager
    name: "To-Do List Manager"
    description: "Mark's collaborative to-do list manager."
    path: "to-do-list-manager"
    url: "/todos"
    port: 5001
    status: active
    hidden: true

  - id: leiden-collection
    name: "Leiden Dissertations Collection"
    description: "Browse and search ~350,000 European doctoral dissertations (1600s–1990) donated by Leiden University, digitized progressively on the Internet Archive. Wave 1 of a broader ANT-based explorer with planned Wikidata reconciliation and curation tooling."
    # path = the Leiden project repo (metadata sync script + future ANT accessioning),
    # separate from this repo. The web UI lives here (src/app/collections/leiden).
    path: "Leiden"
    url: "/collections/leiden"
    status: active
    project_info:
      note: "Live search/browse · metadata mirror synced from archive.org"
      link_text: "Browse Collection"
      link_url: "/collections/leiden"

